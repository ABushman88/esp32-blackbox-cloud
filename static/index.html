<!DOCTYPE html>
<html>
<head>
<title>ESP32 Blackbox</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/luxon@3/build/global/luxon.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1"></script>

<style>
body {
    background:#121212;
    color:white;
    font-family:Arial;
    margin:10px;
}

.status-bar{
    display:flex;
    gap:15px;
}

.device{
    flex:1;
    background:#1e1e1e;
    padding:10px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 0 10px #000;
}

.value{
    font-size:26px;
    font-weight:bold;
}

.status-dot{
    width:12px;
    height:12px;
    border-radius:50%;
    margin:6px auto;
    background:red;
    box-shadow:0 0 6px red;
}

.online{
    background:#00ff00;
    box-shadow:0 0 10px #00ff00;
}

.offline{
    background:red;
    box-shadow:0 0 10px red;
}

.chart-container{
    height:300px;
    margin-top:10px;
}

canvas{
    background:#1e1e1e;
    border-radius:10px;
}
</style>
</head>

<body>

<h1>ESP32 Blackbox Dashboard</h1>

<div class="status-bar">
    <div class="device">
        <h3>ESP32 #1</h3>
        <div id="status1" class="status-dot"></div>
        <div class="value" id="t1">--</div>
        <small>Temp</small>
        <div class="value" id="h1">--</div>
        <small>Humidity</small>
    </div>

    <div class="device">
        <h3>ESP32 #2</h3>
        <div id="status2" class="status-dot"></div>
        <div class="value" id="t2">--</div>
        <small>Temp</small>
        <div class="value" id="h2">--</div>
        <small>Humidity</small>
    </div>
</div>

<div class="chart-container">
    <canvas id="tempChart"></canvas>
</div>

<div class="chart-container">
    <canvas id="humChart"></canvas>
</div>

<script>
async function fetchData() {
    const res = await fetch("/data");
    return await res.json();
}

const tempChart = new Chart(document.getElementById("tempChart"), {
    type: "line",
    data: {
        labels: [],
        datasets: [
            { label: "ESP32 #1", borderColor: "red", data: [], fill: false },
            { label: "ESP32 #2", borderColor: "lime", data: [], fill: false }
        ]
    },
   options: {
    responsive: true,
    maintainAspectRatio: false,
    spanGaps: true,
    scales: {
        x: {
            type: "time",
            time: {
                parser: "YYYY-MM-DD HH:mm:ss",
                tooltipFormat: "HH:mm:ss",
                unit: "second",
                displayFormats: { second: "HH:mm:ss" }
            },
            ticks: { color: "white" }
        },
        y: {
            ticks: {
                color: "white",
                callback: function(value) {
                    return Number(value).toFixed(1) + " °C";
                }
            }
        }
    }
}
});

const humChart = new Chart(document.getElementById("humChart"), {
    type: "line",
    data: {
        labels: [],
        datasets: [
            { label: "ESP32 #1", borderColor: "cyan", data: [], fill: false },
            { label: "ESP32 #2", borderColor: "orange", data: [], fill: false }
        ]
    },
    options: {
    responsive: true,
    maintainAspectRatio: false,
    spanGaps: true,
    scales: {
        x: {
            type: "time",
            time: {
                parser: "YYYY-MM-DD HH:mm:ss",
                tooltipFormat: "HH:mm:ss",
                unit: "second",
                displayFormats: { second: "HH:mm:ss" }
            },
            ticks: { color: "white" }
        },
        y: {
            ticks: {
                color: "white",
                callback: function(value) {
                    return Number(value).toFixed(1) + " %";
                }
            }
        }
    }
}
});
async function update() {
    const d = await fetchData();

    // Build a timestamp → {t1, t2, h1, h2} map
    const map = {};

    d.timestamps.forEach((ts, i) => {
        if (!map[ts]) {
            map[ts] = { t1: null, t2: null, h1: null, h2: null };
        }

        if (d.device_ids[i] === "esp32_blackbox_1") {
            map[ts].t1 = d.temperatures[i];
            map[ts].h1 = d.humidities[i];
        } else if (d.device_ids[i] === "esp32_blackbox_2") {
            map[ts].t2 = d.temperatures[i];
            map[ts].h2 = d.humidities[i];
        }
    });

    // Extract aligned arrays
    const labels = Object.keys(map).map(t => new Date(t.replace(" ", "T")));
    let t1 = Object.values(map).map(v => v.t1);
    let t2 = Object.values(map).map(v => v.t2);
    let h1 = Object.values(map).map(v => v.h1);
    let h2 = Object.values(map).map(v => v.h2);

    // Backfill missing early values so both lines start together
    function backfill(arr) {
        const first = arr.find(v => v !== null);
        return arr.map(v => v === null ? first : v);
    }

    t1 = backfill(t1);
    t2 = backfill(t2);
    h1 = backfill(h1);
    h2 = backfill(h2);

    // Update charts
    tempChart.data.labels = labels;
    tempChart.data.datasets[0].data = t1;
    tempChart.data.datasets[1].data = t2;
    tempChart.update();

    humChart.data.labels = labels;
    humChart.data.datasets[0].data = h1;
    humChart.data.datasets[1].data = h2;
    humChart.update();

    // Latest values with units
    const lastT1 = t1.slice(-1)[0];
    const lastH1 = h1.slice(-1)[0];
    const lastT2 = t2.slice(-1)[0];
    const lastH2 = h2.slice(-1)[0];

    document.getElementById("t1").innerText = lastT1 !== undefined ? lastT1 + " °C" : "--";
    document.getElementById("h1").innerText = lastH1 !== undefined ? lastH1 + " %" : "--";

    document.getElementById("t2").innerText = lastT2 !== undefined ? lastT2 + " °C" : "--";
    document.getElementById("h2").innerText = lastH2 !== undefined ? lastH2 + " %" : "--";

    // Status
    document.getElementById("status1").className =
        "status-dot " + (d.status["esp32_blackbox_1"] || "offline");

    document.getElementById("status2").className =
        "status-dot " + (d.status["esp32_blackbox_2"] || "offline");
}
    
setInterval(update, 3000);
update();
</script>

</body>
</html>
